<!--
  LAL Jeans — Pieza gráfica "Características del jean"
  VARIANTE V1 — OVERLAY estilo post social / Instagram
  =====================================================================
  Los textos flotan sobre la foto del jean con badges numerados
  (lima + morado) en lugar de flechas. Ideal para contenido visual,
  Instagram, o como banner.

  Cambia --lal-feature-photo por la URL de tu foto (Shopify Files).
  =====================================================================
-->

<style>
  :root {
    --lal-lime: #d7e34a;
    --lal-purple: #b4a0ff;
    --lal-ink: #0a0a0a;
    --lal-cream: #efe9df;
    --lal-feature-photo: url("https://cdn.shopify.com/s/files/1/0666/3458/0146/files/Sin-titulo-15.jpg?v=1764094550");
  }

  .lal-feat-ov,
  .lal-feat-ov * { box-sizing: border-box; }
  .lal-feat-ov {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--lal-ink);
    background: var(--lal-cream);
    padding: 32px 0;
  }
  .lal-feat-ov__container {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .lal-feat-ov__photo {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    aspect-ratio: 3/4;
    background-color: #1a1a1a;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.3);
  }
  .lal-feat-ov__img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* ---- Cues (callouts sobre la foto) ---- */
  .lal-feat-ov__cue {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    line-height: 1.15;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    max-width: 220px;
    z-index: 2;
  }
  .lal-feat-ov__cue--right {
    flex-direction: row-reverse;
    text-align: right;
  }
  .lal-feat-ov__badge {
    flex-shrink: 0;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--lal-lime);
    color: var(--lal-ink);
    font-weight: 900;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    text-shadow: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    border: 2px solid rgba(255,255,255,0.9);
  }
  .lal-feat-ov__cue--purple .lal-feat-ov__badge {
    background: var(--lal-purple);
  }

  /* ---- Posiciones de cada cue ---- */
  .lal-feat-ov__cue--1 { top: 8%;  left: 3%; }
  .lal-feat-ov__cue--2 { top: 28%; right: 3%; }
  .lal-feat-ov__cue--3 { top: 52%; left: 3%; }
  .lal-feat-ov__cue--4 { top: 70%; right: 3%; }
  .lal-feat-ov__cue--5 { top: 88%; left: 3%; }

  /* ---- Responsive ---- */
  @media (max-width: 600px) {
    .lal-feat-ov__cue {
      font-size: 12px;
      max-width: 140px;
      gap: 7px;
    }
    .lal-feat-ov__badge {
      width: 28px; height: 28px;
      font-size: 12px;
    }
  }
  @media (min-width: 900px) {
    .lal-feat-ov { padding: 56px 0; }
    .lal-feat-ov__container { max-width: 900px; }
    .lal-feat-ov__cue { font-size: 18px; max-width: 260px; }
    .lal-feat-ov__badge { width: 42px; height: 42px; font-size: 16px; }
  }
</style>

<section class="lal-feat-ov">
  <div class="lal-feat-ov__container">
    <div class="lal-feat-ov__photo">
      <img class="lal-feat-ov__img"
           src="https://cdn.shopify.com/s/files/1/0666/3458/0146/files/Sin-titulo-15.jpg?v=1764094550"
           alt="Jean LALÍ — características">

      <div class="lal-feat-ov__cue lal-feat-ov__cue--1">
        <span class="lal-feat-ov__badge">1</span>
        <span>Cintura alta<br>que estiliza</span>
      </div>

      <div class="lal-feat-ov__cue lal-feat-ov__cue--purple lal-feat-ov__cue--right lal-feat-ov__cue--2">
        <span class="lal-feat-ov__badge">2</span>
        <span>Fit que realza<br>la silueta</span>
      </div>

      <div class="lal-feat-ov__cue lal-feat-ov__cue--3">
        <span class="lal-feat-ov__badge">3</span>
        <span>Diseño hecho<br>en Colombia</span>
      </div>

      <div class="lal-feat-ov__cue lal-feat-ov__cue--purple lal-feat-ov__cue--right lal-feat-ov__cue--4">
        <span class="lal-feat-ov__badge">4</span>
        <span>Denim<br>premium</span>
      </div>

      <div class="lal-feat-ov__cue lal-feat-ov__cue--5">
        <span class="lal-feat-ov__badge">5</span>
        <span>Ajuste<br>personalizado</span>
      </div>

    </div>
  </div>
</section>
