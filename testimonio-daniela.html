<script>
// Foto automática desde IG vía unavatar.io. Si prefieres foto estática, reemplaza el background-image del avatar.
// Si unavatar falla, se muestran las iniciales DA en fondo lila.
(function(){
  var el=document.getElementById('laliTwAvatar');
  var img=new Image();
  img.onload=function(){el.textContent='';};
  img.onerror=function(){el.style.backgroundImage='none';};
  img.src='https://unavatar.io/instagram/danielaarangoa';
})();
</script>
