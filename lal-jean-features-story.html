<!--
  LAL Jeans — Pieza para Instagram Story (9:16, 1080x1920)
  =====================================================================
  Todo escala proporcional al canvas gracias a container queries (cqw/cqh).
  Se ve igual de bien en tu pantalla que exportado a 1080x1920.

  EXPORTAR A PNG 1080x1920:
    1) htmlcsstoimage.com: pega este HTML, viewport 1080x1920
    2) Chrome: F12 → modo responsive → 1080x1920 → Cmd+Shift+P →
       "Capture full size screenshot"
  =====================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LALÍ — Story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Canvas 9:16 que se ajusta al viewport y mantiene proporción */
  .story {
    --lal-lime: #d7e34a;
    --lal-purple: #b4a0ff;
    --lal-ink: #0a0a0a;

    position: relative;
    aspect-ratio: 9 / 16;
    height: 100vh;
    max-width: 100vw;
    overflow: hidden;
    background: #1a1a1a;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);

    /* Activar container queries: todos los hijos con cqw/cqh escalan
       con el tamaño real del canvas (no con el viewport) */
    container-type: size;
    container-name: story;
  }
  .story * { box-sizing: border-box; }

  /* Si la ventana es muy angosta, ancho por 100vw y alto calculado */
  @media (max-aspect-ratio: 9/16) {
    .story {
      width: 100vw;
      height: auto;
    }
  }

  /* ---- Foto de fondo ---- */
  .story__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .story__shade-top,
  .story__shade-bottom {
    position: absolute;
    left: 0; right: 0;
    pointer-events: none;
    z-index: 1;
  }
  .story__shade-top {
    top: 0;
    height: 32cqh;
    background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
  }
  .story__shade-bottom {
    bottom: 0;
    height: 32cqh;
    background: linear-gradient(to top, rgba(0,0,0,0.78), transparent);
  }

  /* ---- Header ---- */
  .story__header {
    position: absolute;
    top: 7cqh;
    left: 6cqw;
    right: 6cqw;
    z-index: 3;
    text-align: center;
    color: #fff;
  }
  .story__eyebrow {
    display: inline-block;
    background: var(--lal-lime);
    color: var(--lal-ink);
    font-size: 2.1cqw;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 1cqw 2.2cqw;
    border-radius: 999px;
    margin: 0 0 2.4cqh;
  }
  .story__title {
    font-size: 6.2cqw;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0;
    text-shadow: 0 0.4cqw 1.8cqw rgba(0,0,0,0.55);
  }
  .story__title em {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 800;
  }

  /* ---- Callouts ---- */
  .cue {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 1.8cqw;
    color: #fff;
    font-weight: 800;
    font-size: 3.1cqw;
    line-height: 1.1;
    text-shadow: 0 0.3cqw 1.4cqw rgba(0,0,0,0.7);
    max-width: 40cqw;
    z-index: 3;
  }
  .cue--right {
    flex-direction: row-reverse;
    text-align: right;
  }
  .cue__badge {
    flex-shrink: 0;
    width: 6.5cqw; height: 6.5cqw;
    border-radius: 50%;
    background: var(--lal-lime);
    color: var(--lal-ink);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 900;
    font-size: 2.9cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: none;
    box-shadow: 0 0.7cqw 2cqw rgba(0,0,0,0.5);
    border: 0.28cqw solid rgba(255,255,255,0.95);
  }
  .cue--purple .cue__badge { background: var(--lal-purple); }

  /* Posiciones (usando % del canvas) */
  .cue--1 { top: 30cqh; left: 5.5cqw; }
  .cue--2 { top: 43cqh; right: 5.5cqw; }
  .cue--3 { top: 56cqh; left: 5.5cqw; }
  .cue--4 { top: 66cqh; right: 5.5cqw; }
  .cue--5 { top: 76cqh; left: 5.5cqw; }

  /* ---- Footer ---- */
  .story__footer {
    position: absolute;
    bottom: 8cqh;
    left: 6cqw;
    right: 6cqw;
    z-index: 3;
    text-align: center;
    color: #fff;
  }
  .story__logo {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 5.2cqw;
    font-weight: 900;
    letter-spacing: 0.02em;
    margin: 0 0 0.6cqh;
    text-shadow: 0 0.3cqw 1.6cqw rgba(0,0,0,0.6);
  }
  .story__tagline {
    font-size: 2cqw;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.9;
    margin: 0;
  }
</style>
</head>
<body>

<div class="story">

  <img class="story__bg"
       src="https://cdn.shopify.com/s/files/1/0666/3458/0146/files/Sin-titulo-15.jpg?v=1764094550"
       alt="Jean LALÍ">

  <div class="story__shade-top"></div>
  <div class="story__shade-bottom"></div>

  <div class="story__header">
    <span class="story__eyebrow">Por qué elegir LALÍ</span>
    <h1 class="story__title">Cada detalle,<br><em>pensado en ti.</em></h1>
  </div>

  <div class="cue cue--1">
    <span class="cue__badge">1</span>
    <span>Cintura alta<br>que estiliza</span>
  </div>

  <div class="cue cue--purple cue--right cue--2">
    <span class="cue__badge">2</span>
    <span>Fit que realza<br>la silueta</span>
  </div>

  <div class="cue cue--3">
    <span class="cue__badge">3</span>
    <span>Hecho en<br>Colombia</span>
  </div>

  <div class="cue cue--purple cue--right cue--4">
    <span class="cue__badge">4</span>
    <span>Denim<br>premium</span>
  </div>

  <div class="cue cue--5">
    <span class="cue__badge">5</span>
    <span>Ajuste<br>personalizado</span>
  </div>

  <div class="story__footer">
    <p class="story__logo">LALÍ</p>
    <p class="story__tagline">Jeans personalizados · lalijeans.com</p>
  </div>

</div>

</body>
</html>
