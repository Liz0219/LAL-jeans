<!--
  LAL Jeans — Pieza para Instagram Story (9:16, 1080x1920)
  =====================================================================
  Layout en 3 zonas claras (sin overlaps):
    [ 0 - 24% ] HEADER: eyebrow + título
    [ 24 - 80% ] ZONA DE CALLOUTS sobre la foto
    [ 80 - 100% ] FOOTER: logo + tagline

  Todo en unidades cqw/cqh para escalar proporcional al canvas 9:16.
  =====================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LALÍ — Story</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .story {
    --lal-lime: #d7e34a;
    --lal-purple: #b4a0ff;
    --lal-ink: #0a0a0a;

    position: relative;
    aspect-ratio: 9 / 16;
    height: 100vh;
    max-width: 100vw;
    overflow: hidden;
    background: #1a1a1a;
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);

    container-type: size;
    container-name: story;
  }
  .story * { box-sizing: border-box; }

  @media (max-aspect-ratio: 9/16) {
    .story { width: 100vw; height: auto; }
  }

  /* ---- Foto de fondo ---- */
  .story__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* Banda oscura arriba (para header) y abajo (para footer) */
  .story__shade-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 26cqh;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }
  .story__shade-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 24cqh;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* ---- HEADER (zona 0 - 24%) ---- */
  .story__header {
    position: absolute;
    top: 4.5cqh;
    left: 6cqw;
    right: 6cqw;
    z-index: 3;
    text-align: center;
    color: #fff;
  }
  .story__eyebrow {
    display: inline-block;
    background: var(--lal-lime);
    color: var(--lal-ink);
    font-size: 1.9cqw;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 1cqw 2.4cqw;
    border-radius: 999px;
    margin: 0 0 1.6cqh;
  }
  .story__title {
    font-size: 4.8cqw;
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -0.02em;
    margin: 0;
    text-shadow: 0 0.3cqw 1.4cqw rgba(0,0,0,0.65);
  }
  .story__title em {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 800;
  }

  /* ---- CALLOUTS (zona 26 - 78%) ---- */
  .cue {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 1.5cqw;
    color: #fff;
    font-weight: 800;
    font-size: 2.6cqw;
    line-height: 1.1;
    text-shadow: 0 0.3cqw 1cqw rgba(0,0,0,0.8);
    max-width: 36cqw;
    z-index: 3;
  }
  .cue--right {
    flex-direction: row-reverse;
    text-align: right;
  }
  .cue__badge {
    flex-shrink: 0;
    width: 5.5cqw; height: 5.5cqw;
    border-radius: 50%;
    background: var(--lal-lime);
    color: var(--lal-ink);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 900;
    font-size: 2.4cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: none;
    box-shadow: 0 0.5cqw 1.6cqw rgba(0,0,0,0.5);
    border: 0.22cqw solid rgba(255,255,255,0.95);
  }
  .cue--purple .cue__badge { background: var(--lal-purple); }

  /* 5 callouts repartidos entre 28% y 74% vertical */
  .cue--1 { top: 28cqh; left: 6cqw; }
  .cue--2 { top: 39cqh; right: 6cqw; }
  .cue--3 { top: 51cqh; left: 6cqw; }
  .cue--4 { top: 62cqh; right: 6cqw; }
  .cue--5 { top: 73cqh; left: 6cqw; }

  /* ---- FOOTER (zona 82 - 100%) ---- */
  .story__footer {
    position: absolute;
    bottom: 5cqh;
    left: 6cqw;
    right: 6cqw;
    z-index: 3;
    text-align: center;
    color: #fff;
  }
  .story__logo {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: 4.4cqw;
    font-weight: 900;
    letter-spacing: 0.04em;
    margin: 0 0 0.4cqh;
    text-shadow: 0 0.3cqw 1.2cqw rgba(0,0,0,0.65);
    line-height: 1;
  }
  .story__tagline {
    font-size: 1.7cqw;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.9;
    margin: 0;
    line-height: 1.2;
  }
</style>
</head>
<body>

<div class="story">

  <img class="story__bg"
       src="https://cdn.shopify.com/s/files/1/0666/3458/0146/files/Sin-titulo-15.jpg?v=1764094550"
       alt="Jean LALÍ">

  <div class="story__shade-top"></div>
  <div class="story__shade-bottom"></div>

  <!-- HEADER -->
  <div class="story__header">
    <span class="story__eyebrow">Por qué elegir LALÍ</span>
    <h1 class="story__title">Cada detalle, <em>pensado en ti.</em></h1>
  </div>

  <!-- CALLOUTS -->
  <div class="cue cue--1">
    <span class="cue__badge">1</span>
    <span>Cintura alta<br>que estiliza</span>
  </div>

  <div class="cue cue--purple cue--right cue--2">
    <span class="cue__badge">2</span>
    <span>Fit que realza<br>la silueta</span>
  </div>

  <div class="cue cue--3">
    <span class="cue__badge">3</span>
    <span>Hecho en<br>Colombia</span>
  </div>

  <div class="cue cue--purple cue--right cue--4">
    <span class="cue__badge">4</span>
    <span>Denim<br>premium</span>
  </div>

  <div class="cue cue--5">
    <span class="cue__badge">5</span>
    <span>Ajuste<br>personalizado</span>
  </div>

  <!-- FOOTER -->
  <div class="story__footer">
    <p class="story__logo">LALÍ</p>
    <p class="story__tagline">lalijeans.com</p>
  </div>

</div>

</body>
</html>
